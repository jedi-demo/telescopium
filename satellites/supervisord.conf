[unix_http_server]
file=/home/pixlab/jiddon/telescopium/satellites/supervisor.sock

[inet_http_server]
port=*:9001
username=pixlab
password=pixlab123

[supervisord]
logfile=/home/pixlab/jiddon/telescopium/satellites/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/home/pixlab/jiddon/telescopium/satellites/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=1024
umask=022
user=pixlab
identifier=supervisor
directory=/home/pixlab/jiddon/telescopium/satellites
childlogdir=/home/pixlab/jiddon/telescopium/satellites/logs
nocleanup=true
strip_ansi=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/pixlab/jiddon/telescopium/satellites/supervisor.sock

[program:dcs_TTiQL]
command=/home/pixlab/jiddon/telescopium/venv/bin/python -m DCS.TTiQLSatellite -g dcs -n TTiQL
process_name=dcs_TTiQL
autostart=false
autorestart=true
startretries=3
startsecs=1
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/home/pixlab/jiddon/telescopium/satellites/logs/dcs/TTiQL.out.log
stderr_logfile=/home/pixlab/jiddon/telescopium/satellites/logs/dcs/TTiQL.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_backups=5
user=pixlab
directory=/home/pixlab/jiddon/telescopium/satellites
environment=PYTHONUNBUFFERED="1"

